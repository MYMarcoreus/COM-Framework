<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DataHub · 设备间数据传输</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="brand" onclick="toggleMembers()">
      <div class="title">💬 DataHub 聊天室</div>
      <div class="subtitle">同局域网设备实时互传</div>
    </div>
    <div class="spacer"></div>
    <div class="status" onclick="toggleMembers()" title="查看成员">
      <span class="dot"></span><span id="statusText">连接中…</span>
    </div>
  </div>

  <!-- 租户栏 -->
  <div class="tenantbar" id="tenantBar">
    <span class="tn-label">🏢 租户</span>
    <span class="tn-current" id="tenantName">公共租户</span>
    <button type="button" class="tn-toggle" id="tenantToggle">切换 / 新建 ▾</button>
  </div>
  <!-- 租户面板（下拉） -->
  <div class="tenantpanel" id="tenantPanel">
    <div class="tn-list-title">我的租户（点击名称进入）</div>
    <div class="tn-list" id="tenantList"></div>
    <div class="tn-row"><input id="tnCreateName" placeholder="新租户名称…" maxlength="48"><button id="tnCreateBtn">创建</button></div>
    <div class="tn-row"><input id="tnJoinCode" placeholder="输入 6 位租户码加入" maxlength="6"><button id="tnJoinBtn">加入</button></div>
    <div class="tn-hint">凭租户码进入/共享；公共租户为未选择租户时的默认地。</div>
  </div>

  <!-- 成员面板 -->
  <div class="members" id="members">
    <div class="mtitle">👥 在线成员（IP:端口）</div>
    <div id="memberList"><div style="color:var(--muted);font-size:13px;">加载中…</div></div>
  </div>

  <!-- 消息区 -->
  <div class="chat" id="chat">
    <div class="sys"><span>💬 欢迎来到聊天室，同地址设备实时同步</span></div>
  </div>

  <!-- 输入栏 -->
  <div class="inputbar">
    <button class="plus" id="plusBtn" title="发送文件">＋</button>
    <textarea id="input" placeholder="输入消息，回车发送" rows="1"></textarea>
    <button class="send" id="sendBtn">发送</button>
  </div>

  <input type="file" id="fileInput" style="display:none">
  <div class="overlay" id="overlay">
    <img id="overlayImg" src="">
    <div class="overlay-bar">
      <span id="overlayName"></span>
      <button id="overlayDl">下载原图</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
