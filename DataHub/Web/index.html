<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DataHub · 设备间数据传输</title>
<style>
  :root {
    --header:#2c3e50; --chat-bg:#f0f2f5; --mine:#95ec69; --other:#ffffff;
    --text:#1f2937; --muted:#9ca3af; --accent:#10b981; --danger:#ef4444;
    --border:#e5e7eb; --member:#eef2ff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
      "PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--chat-bg); color:var(--text);
    /* 100dvh: 移动端动态视口高度，键盘弹出时布局不被压缩到屏外 */
    height:100vh; height:100dvh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ===== 顶栏 ===== */
  .topbar {
    background:var(--header); color:#fff; padding:12px 16px; flex-shrink:0;
    display:flex; align-items:center; gap:10px; box-shadow:0 1px 4px rgba(0,0,0,.2);
    z-index:10;
  }
  .topbar .brand { cursor:pointer; }
  .topbar .title { font-size:17px; font-weight:700; letter-spacing:.3px; }
  .topbar .subtitle { font-size:12px; opacity:.75; }
  .topbar .spacer { flex:1; }
  .topbar .status { font-size:12px; background:rgba(255,255,255,.15); padding:4px 10px;
    border-radius:12px; display:flex; align-items:center; gap:5px; cursor:pointer; }
  .status .dot { width:7px; height:7px; border-radius:50%; background:#22c55e; display:inline-block; }

  /* ===== 成员面板 ===== */
  .members { display:none; background:var(--member); border-bottom:1px solid var(--border);
    padding:8px 16px; flex-shrink:0; max-height:180px; overflow-y:auto; }
  .members.show { display:block; }
  .members .mtitle { font-size:12px; color:#6366f1; font-weight:600; margin-bottom:6px; }
  .members .mrow { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; }
  .members .mrow .mdot { width:8px; height:8px; border-radius:50%; background:#22c55e; }
  .members .mrow .maddr { font-family:ui-monospace,Menlo,monospace; }
  .members .mrow .mlast { margin-left:auto; color:var(--muted); font-size:11px; }

  /* ===== 消息区 ===== */
  .chat { flex:1; overflow-y:auto; padding:14px 12px; -webkit-overflow-scrolling:touch; }
  .msg { display:flex; margin-bottom:16px; align-items:flex-end; }
  .msg.mine { justify-content:flex-end; }
  .msg.other { justify-content:flex-start; }
  .avatar { width:36px; height:36px; border-radius:8px; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-size:16px; font-weight:600; }
  .msg.mine .avatar { order:2; margin-left:8px; background:#d1fae5; color:#047857; }
  .msg.other .avatar { order:0; margin-right:8px; background:#dbeafe; color:#1d4ed8; }
  .bubble { max-width:72%; padding:9px 12px; border-radius:10px; font-size:15px;
    line-height:1.55; word-break:break-word; position:relative; }
  .msg.mine .bubble { order:1; background:var(--mine); border-top-right-radius:3px; }
  .msg.other .bubble { order:1; background:var(--other); border-top-left-radius:3px;
    box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .bubble .meta-row { margin-top:5px; display:flex; align-items:center; gap:8px; font-size:11px;
    color:#6b7280; }
  .bubble .sender { font-weight:600; color:#4b5563; }
  .bubble .time { margin-left:auto; }
  /* 文件气泡 */
  .file-card { min-width:200px; max-width:72%; background:var(--other); border-radius:10px;
    padding:10px 12px; display:flex; align-items:center; gap:10px; cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .msg.mine .file-card { background:#e8f7df; }
  .file-card .ficon { font-size:26px; flex-shrink:0; }
  .file-card .fmeta { flex:1; min-width:0; }
  .file-card .fname { font-size:14px; font-weight:600; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .file-card .finfo { font-size:11px; color:var(--muted); margin-top:2px; }
  .file-card .fdown { flex-shrink:0; background:var(--accent); color:#fff; font-size:12px;
    padding:6px 12px; border-radius:6px; }
  /* 图片内联预览 */
  .img-bubble { max-width:72%; border-radius:10px; overflow:hidden; cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .img-bubble img { display:block; max-width:100%; max-height:280px; object-fit:contain; }
  /* 系统消息 / 时间分隔 */
  .sys { text-align:center; color:var(--muted); font-size:12px; margin:10px 0; }
  .sys span { background:rgba(0,0,0,.05); padding:3px 10px; border-radius:10px; }

  /* ===== 底部输入栏 ===== */
  .inputbar { background:#fff; border-top:1px solid var(--border); padding:8px 10px;
    flex-shrink:0; display:flex; align-items:flex-end; gap:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
  .inputbar .plus { width:38px; height:38px; border:none; border-radius:50%; background:#f3f4f6;
    font-size:20px; cursor:pointer; color:#374151; flex-shrink:0; }
  .inputbar textarea { flex:1; border:none; outline:none; background:#f3f4f6; border-radius:8px;
    padding:10px 12px; font-size:15px; resize:none; max-height:100px; font-family:inherit;
    line-height:1.4; }
  .inputbar .send { width:64px; height:38px; border:none; border-radius:8px; background:var(--accent);
    color:#fff; font-size:15px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .inputbar .send:active { opacity:.8; }

  /* 图片预览浮层 */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:99; display:none;
    align-items:center; justify-content:center; }
  .overlay.show { display:flex; }
  .overlay img { max-width:92%; max-height:92%; border-radius:8px; }

  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:rgba(17,24,39,.88); color:#fff; padding:9px 16px; border-radius:8px;
    font-size:13px; z-index:100; display:none; box-shadow:0 4px 12px rgba(0,0,0,.2); }
</style>
</head>
<body>
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="brand" onclick="toggleMembers()">
      <div class="title">💬 DataHub 聊天室</div>
      <div class="subtitle">同局域网设备实时互传</div>
    </div>
    <div class="spacer"></div>
    <div class="status" onclick="toggleMembers()" title="查看成员">
      <span class="dot"></span><span id="statusText">连接中…</span>
    </div>
  </div>

  <!-- 成员面板 -->
  <div class="members" id="members">
    <div class="mtitle">👥 在线成员（IP:端口）</div>
    <div id="memberList"><div style="color:var(--muted);font-size:13px;">加载中…</div></div>
  </div>

  <!-- 消息区 -->
  <div class="chat" id="chat">
    <div class="sys"><span>💬 欢迎来到聊天室，同地址设备实时同步</span></div>
  </div>

  <!-- 输入栏 -->
  <div class="inputbar">
    <button class="plus" id="plusBtn" title="发送文件">＋</button>
    <textarea id="input" placeholder="输入消息，回车发送" rows="1"></textarea>
    <button class="send" id="sendBtn">发送</button>
  </div>

  <input type="file" id="fileInput" style="display:none">
  <div class="overlay" id="overlay"><img id="overlayImg" src=""></div>
  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ============ 状态 ============
  var seen = {};      // 已渲染的消息 id → true
  var POLL_MS = 2000; // 轮询间隔
  var membersShown = false;

  // ============ 客户端标识（跨请求标识同一浏览器，避免成员按端口膨胀） ============
  function getClientId() {
    var KEY = 'datahub_client_id';
    var id = '';
    try { id = localStorage.getItem(KEY) || ''; } catch(e){}
    if (!id) {
      // 生成 UUID v4
      id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
        var r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
        return v.toString(16);
      });
      try { localStorage.setItem(KEY, id); } catch(e){}
    }
    return id;
  }
  var CLIENT_ID = getClientId();

  // 统一 fetch：自动附加 X-Client-Id 请求头（成员标识）。
  function apiFetch(url, options) {
    options = options || {};
    options.headers = options.headers || {};
    options.headers['X-Client-Id'] = CLIENT_ID;
    return fetch(url, options);
  }

  // ============ 分段拉取文件 ============
  // workflow 对单次超大响应体在部分网络环境下会截断（约 110KB），故大文件
  // 采用 HTTP Range 分段拉取再拼接，每次请求都小于阈值，保证可靠传输。
  var CHUNK_SIZE = 64 * 1024;   // 64KB/段，远小于 110KB 阈值
  function fetchFile(id, onProgress) {
    var url = '/api/file/' + encodeURIComponent(id);
    return apiFetch(url, { headers: { 'Range': 'bytes=0-0' } })
      .then(function(r){
        if (!r.ok) throw new Error('文件不存在 (' + r.status + ')');
        // 读取 Content-Range: bytes 0-0/total
        var cr = r.headers.get('Content-Range') || '';
        var m = /\/\s*(\d+)/.exec(cr);
        if (!m) {
          // 服务器未支持 Range（小文件完整返回）——直接读完整 body
          return apiFetch(url).then(function(r2){
            if (!r2.ok) throw new Error('加载失败 (' + r2.status + ')');
            return r2.blob();
          });
        }
        var total = parseInt(m[1], 10);
        if (total <= 0) return new Blob([]);
        // 分段拉取
        var parts = [];
        var done = 0;
        var fetchOne = function(start) {
          var end = Math.min(start + CHUNK_SIZE - 1, total - 1);
          return apiFetch(url, { headers: { 'Range': 'bytes=' + start + '-' + end } })
            .then(function(r){
              if (!r.ok) throw new Error('分段拉取失败 (' + r.status + ')');
              return r.arrayBuffer();
            })
            .then(function(buf){
              parts.push(new Uint8Array(buf));
              done += buf.byteLength;
              if (onProgress) onProgress(done, total);
            });
        };
        var chain = Promise.resolve();
        for (var s = 0; s < total; s += CHUNK_SIZE) {
          (function(start){ chain = chain.then(function(){ return fetchOne(start); }); })(s);
        }
        return chain.then(function(){
          var merged = new Uint8Array(total);
          var off = 0;
          for (var i = 0; i < parts.length; i++) {
            merged.set(parts[i], off);
            off += parts[i].length;
          }
          return new Blob([merged.buffer]);
        });
      });
  }

  // ============ DOM 工具 ============
  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
    return (n/1048576).toFixed(1) + ' MB';
  }
  function fmtTime(ms) {
    var d = new Date(ms);
    function p(x){ return (x<10?'0':'')+x; }
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtDate(ms) {
    var d = new Date(ms), now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diffDays = Math.round((today - that) / 86400000);
    if (diffDays === 0) return '今天';
    if (diffDays === 1) return '昨天';
    return (d.getMonth()+1) + '月' + d.getDate() + '日';
  }
  // 客户端标识短名：UUID 前 8 位（成员展示用）。
  function shortAddr(id) {
    if (!id) return '未知';
    if (id.indexOf(':') >= 0) return id; // 兼容 IP:port 形式
    return id.slice(0, 8);
  }
  function avatarText(id) {
    if (!id) return '?';
    if (id.indexOf(':') >= 0) {
      var segs = (id.split(':')[0] || id).split('.');
      return segs.length === 4 ? segs[3] : '?';
    }
    return id.slice(0, 2).toUpperCase();
  }
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.style.display = 'none'; }, 1800);
  }

  // ============ 渲染消息 ============
  var chatEl = $('chat');
  var lastDateKey = '';
  function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

  function isImageName(name) {
    return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(name || '');
  }

  function renderMsg(id, type, name, content, mineFlag, from, size, timeMs) {
    if (seen[id]) return;
    seen[id] = true;

    // 时间分组（跨天分隔）
    var d = new Date(timeMs || Date.now());
    var dateKey = fmtDate(d.getTime());
    if (dateKey !== lastDateKey) {
      var sep = document.createElement('div');
      sep.className = 'sys';
      sep.innerHTML = '<span>' + dateKey + ' ' + fmtTime(d.getTime()) + '</span>';
      chatEl.appendChild(sep);
      lastDateKey = dateKey;
    }

    var row = document.createElement('div');
    row.className = 'msg ' + (mineFlag ? 'mine' : 'other');

    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = mineFlag ? '我' : avatarText(from);

    var body;
    if (type === 'file') {
      if (isImageName(name)) {
        // 图片文件：内联预览（点击放大查看原图）。用分段拉取避免大图失败。
        body = document.createElement('div');
        body.className = 'img-bubble';
        body.onclick = function(){ viewImage(id, name); };
        var img = document.createElement('img');
        img.alt = name;
        img.onclick = function(ev){ ev.stopPropagation(); viewImage(id, name); };
        body.appendChild(img);
        img.classList.add('loading');
        fetchFile(id).then(function(blob){
          if (!img._released) {
            img.src = URL.createObjectURL(blob);
            img._url = URL.createObjectURL(blob);
          }
          img.classList.remove('loading');
        }).catch(function(){ img.classList.remove('loading'); });
      } else {
        body = document.createElement('div');
        body.className = 'file-card';
        body.onclick = function(){ downloadFile(id, name); };
        body.innerHTML =
          '<div class="ficon">📎</div>' +
          '<div class="fmeta">' +
            '<div class="fname">' + escapeHtml(name || 'file.bin') + '</div>' +
            '<div class="finfo">' + fmtSize(size) + ' · 点击下载</div>' +
          '</div>' +
          '<div class="fdown">下载</div>';
      }
    } else {
      body = document.createElement('div');
      body.className = 'bubble';
      body.innerHTML =
        '<div class="content">' + escapeHtml(content) + '</div>' +
        '<div class="meta-row">' +
          '<span class="sender">' + (mineFlag ? '我' : escapeHtml(shortAddr(from))) + '</span>' +
          '<span class="time">' + fmtTime(d.getTime()) + '</span>' +
        '</div>';
    }

    row.appendChild(avatar);
    row.appendChild(body);
    chatEl.appendChild(row);
    scrollBottom();
  }

  // ============ 成员 ============
  function toggleMembers() {
    membersShown = !membersShown;
    $('members').classList.toggle('show', membersShown);
    if (membersShown) loadMembers();
  }
  // 暴露给内联 onclick（HTML 中的 onclick="toggleMembers()" 在全局作用域查找）
  window.toggleMembers = toggleMembers;

  function loadMembers() {
    apiFetch('/api/members')
      .then(function(r){ return r.json(); })
      .then(function(j){
        var list = $('memberList');
        var arr = j.members || [];
        if (!arr.length) { list.innerHTML = '<div style="color:var(--muted);font-size:13px;">暂无成员</div>'; return; }
        var html = '';
        arr.forEach(function(m){
          var isMe = (m.id === CLIENT_ID);
          var cls = isMe ? ' style="color:#6366f1;font-weight:600;"' : '';
          html += '<div class="mrow">' +
            '<span class="mdot"></span>' +
            '<span class="maddr"' + cls + '>' + escapeHtml(m.ip || '未知') + (isMe ? '（我）' : '') + '</span>' +
            '<span class="mlast">' + fmtTime(m.last) + '</span>' +
          '</div>';
        });
        list.innerHTML = html;
      })
      .catch(function(){ $('memberList').innerHTML = '<div style="color:var(--muted);font-size:13px;">加载失败</div>'; });
  }

  // ============ 发送文本 ============
  function sendText() {
    var input = $('input');
    var text = input.value.trim();
    if (!text) return;
    input.value = ''; input.style.height = 'auto';
    apiFetch('/api/text', { method:'POST', body:text })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j.id) {
          renderMsg(j.id, 'text', '', text, true, CLIENT_ID, 0, Date.now());
        } else toast(j.error || '发送失败');
      })
      .catch(function(){ toast('网络错误'); });
  }

  // ============ 发送文件 ============
  function sendFile(file) {
    toast('上传中 ' + file.name + ' …');
    apiFetch('/api/file', {
      method:'POST',
      headers:{ 'X-File-Name': encodeURIComponent(file.name) },
      body:file
    })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j.id) {
          renderMsg(j.id, 'file', file.name, '', true, CLIENT_ID, file.size, Date.now());
        } else toast(j.error || '上传失败');
      })
      .catch(function(){ toast('网络错误'); });
  }

  // ============ 轮询（同步消息 + 成员） ============
  function poll() {
    apiFetch('/api/list')
      .then(function(r){ return r.json(); })
      .then(function(j){
        var items = j.items || [];
        $('statusText').textContent = '在线 · ' + items.length + ' 条';
        var arr = items.slice().reverse(); // 从旧到新
        arr.forEach(function(it){
          // 通过 from（客户端标识）判断是否自己发送：刷新后仍正确。
          var mineFlag = (it.from === CLIENT_ID);
          if (it.type === 'file') {
            renderMsg(it.id, 'file', it.name, '', mineFlag, it.from, it.size, it.time);
          } else {
            if (!seen[it.id]) {
              apiFetch('/api/text/' + encodeURIComponent(it.id))
                .then(function(r){ return r.text(); })
                .then(function(text){
                  renderMsg(it.id, 'text', '', text, it.from === CLIENT_ID, it.from, 0, it.time);
                })
                .catch(function(){});
            }
          }
        });
        scrollBottom();
      })
      .catch(function(){ $('statusText').textContent = '离线'; });

    // 成员（非展开时也更新计数）
    apiFetch('/api/members')
      .then(function(r){ return r.json(); })
      .then(function(j){
        var n = (j.members || []).length;
        $('statusText').textContent = n + ' 人在线 · ' + chatEl.querySelectorAll('.msg').length + ' 条';
        if (membersShown) loadMembers();
      })
      .catch(function(){});
  }

  // ============ 文件下载 / 图片预览 ============
  // 分段拉取后再下载，避免大文件在部分网络环境被截断。
  function downloadFile(id, name) {
    toast('正在下载 ' + (name || '文件') + ' …');
    fetchFile(id, function(done, total){
      var pct = Math.round(done / total * 100);
      if (pct % 25 === 0) toast('下载 ' + pct + '%');
    })
      .then(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = name || 'download.bin';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
        toast('下载完成');
      })
      .catch(function(e){ toast(e.message || '下载失败'); });
  }

  // 图片点击：先预览原图，也可长按/点击下载。
  function viewImage(id, name) {
    toast('加载原图 …');
    fetchFile(id)
      .then(function(blob){
        var url = URL.createObjectURL(blob);
        $('overlayImg').src = url;
        $('overlay').classList.add('show');
        $('overlay')._url = url;
      })
      .catch(function(){ toast('图片加载失败'); });
  }
  $('overlay').addEventListener('click', function(){
    this.classList.remove('show');
    if (this._url) { URL.revokeObjectURL(this._url); this._url = null; }
  });

  // ============ 事件绑定 ============
  $('sendBtn').addEventListener('click', sendText);
  $('input').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  });
  $('input').addEventListener('input', function(){
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });
  $('plusBtn').addEventListener('click', function(){ $('fileInput').click(); });
  $('fileInput').addEventListener('change', function(){
    if (this.files && this.files.length) sendFile(this.files[0]);
    this.value = '';
  });

  // ============ 移动端键盘适配 ============
  // visualViewport：键盘弹出时调整视口高度，保证输入栏可见
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function(){
      // 让输入栏贴住键盘顶
      var vvh = window.visualViewport.height;
      document.body.style.height = vvh + 'px';
      scrollBottom();
    });
  }

  // ============ 启动 ============
  poll();
  setInterval(poll, POLL_MS);
  setInterval(loadMembers, POLL_MS); // 后台更新成员（用于"我"地址推断）
})();
