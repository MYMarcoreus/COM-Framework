# DataHub 数据传输服务配置（ServerCore Config 模块读取）
# 运行服务器时从当前目录读取本文件（datahub.ini）

[server]
port = 8888

[web]
# 前端静态资源目录（独立资源文件：index.html + style.css + app.js，与 C++ 代码分离）。
# 留空时使用默认用户目录 ~/.datahub（构建 DataHub 时由 Makefile 自动部署）。
# 需要自定义时填目录绝对路径，如 dir = /home/user/.datahub
dir =

[log]
level = info
file = datahub.log

[http]
# 单次上传 / 请求体上限（字节）。超过返回 413。0 表示不限制。
max_body_bytes = 33554432

[admin]
# 内部管理 API（/api/admin/*）访问令牌：
# 管理接口仅“本机回环来源 + 携带本令牌”可访问，供独立的 DataHubAdmin 服务器调用。
# 留空 = 不开放管理 API。DataHubAdmin/datahub-admin.ini 的 [upstream] token 须与此一致。
token = datahub-admin-2a7f

[store]
# 存储容量策略（纯内存存储；超限时保存返回失败）。0 表示不限制。
max_items = 0
# 内容总容量上限（MB）
max_total_mb = 0
# 单条内容上限（MB）
max_item_mb = 0
