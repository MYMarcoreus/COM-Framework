# DataHub 数据传输服务配置（ServerCore Config 模块读取）
# 运行服务器时从当前目录读取本文件（datahub.ini）

[server]
port = 8888

[web]
# 前端页面路径（绝对路径；独立资源文件，与 C++ 代码分离）。
# 留空时使用默认用户目录 ~/.datahub/index.html（构建 DataHub 时由 Makefile 自动部署）。
# 需要自定义时填绝对路径，如 index = /home/user/.datahub/index.html
index =

[log]
level = info
file = datahub.log
