# DataHubAdmin 管理控制面配置（ServerCore Config 模块读取）
# 运行服务器时从当前目录读取本文件（datahub-admin.ini）

[server]
# 管理控制台监听端口（仅本机回环可访问）
port = 8899

[upstream]
# 上游 DataHub 数据面基址（本机回环）
base = http://127.0.0.1:8888
# 管理令牌：须与 DataHub datahub.ini 的 [admin] token 一致（令牌只在服务器侧）
token = datahub-admin-2a7f

[web]
# 管理网页目录（独立资源：index.html + admin.js）。留空使用默认用户目录 ~/.datahub-admin
dir =

[log]
level = info
file = datahub-admin.log
