<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataHub · 服务端管理</title>
<style>
  :root { --text:#1f2937; --muted:#9ca3af; --accent:#10b981; --danger:#ef4444; --border:#e5e7eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; color:var(--text); padding-bottom:40px; }
  header { background:#2c3e50; color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px; }
  header .t { font-size:17px; font-weight:700; }
  header .s { font-size:12px; opacity:.75; }
  header .sp { flex:1; }
  header button { border:none; border-radius:8px; background:rgba(255,255,255,.16); color:#fff; padding:6px 14px; font-size:13px; cursor:pointer; }
  main { max-width:980px; margin:0 auto; padding:16px; }
  .sum { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .sum .card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px 18px; min-width:130px; }
  .sum .card .v { font-size:22px; font-weight:700; }
  .sum .card .k { font-size:12px; color:var(--muted); margin-top:2px; }
  .panel { background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .panel h2 { font-size:15px; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid #f1f5f9; flex-wrap:wrap; }
  .row:last-child { border-bottom:none; }
  .code { font-family:ui-monospace,Menlo,monospace; color:var(--muted); font-size:12px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#eef2ff; color:#6366f1; }
  .badge.dft { background:#d1fae5; color:#047857; }
  .badge.owner { background:#d1fae5; color:#047857; }
  .stat { font-size:12px; color:var(--muted); }
  .sp { flex:1; }
  button.btn { border:none; border-radius:8px; padding:5px 12px; font-size:12px; cursor:pointer; background:var(--accent); color:#fff; }
  button.btn.ghost { background:#eef2ff; color:#6366f1; }
  button.btn.danger { background:#fef2f2; color:var(--danger); }
  .grp { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .grp label { font-size:12px; color:var(--muted); }
  input, select { border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:13px; outline:none; }
  .item-line { font-size:13px; }
  .preview { margin-top:8px; background:#f8fafc; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:13px; white-space:pre-wrap; word-break:break-word; max-height:200px; overflow:auto; }
  .msg { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(17,24,39,.9); color:#fff; padding:9px 16px; border-radius:8px; font-size:13px; display:none; }
</style>
</head>
<body>
<header>
  <div><div class="t">🛠 DataHub · 服务端管理</div><div class="s">控制面 · 管理全部租户 / 成员 / 数据（独立 AdminServer）</div></div>
  <div class="sp"></div>
  <button onclick="loadOverview()">刷新</button>
</header>
<main>
  <div class="sum">
    <div class="card"><div class="v" id="sCount">-</div><div class="k">租户数</div></div>
    <div class="card"><div class="v" id="sItems">-</div><div class="k">数据条目</div></div>
    <div class="card"><div class="v" id="sBytes">-</div><div class="k">占用字节</div></div>
  </div>

  <div class="panel">
    <h2>全部租户</h2>
    <div id="tenantList"><div style="color:var(--muted);font-size:13px;">加载中…</div></div>
  </div>

  <div class="panel" id="detailPanel" style="display:none;">
    <h2 id="dTitle">租户详情</h2>
    <div id="dBody"></div>
  </div>
</main>
<div class="msg" id="msg"></div>
<script src="admin.js"></script>
</body>
</html>
