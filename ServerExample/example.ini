# ServerExample示例配置（Config 模块）
# 运行服务器时从当前目录读取本文件（example.ini）

[server]
port = 9000

[log]
level = info
file = example.log

[timer]
interval_ms = 1000

# 数据访问模块（模拟数据库）：单次表操作的模拟 IO 延迟
# 注意：一次查询 / 一次更新都含 2 个模拟 IO 步骤（取连接 + 表操作）→ 实际耗时约为 2 倍。
# 延迟取大一点（几十 ms），日志里才看得清读写门的差别：
# 3 路并发读 ≈ 1 次查询耗时（读可并发）；3 路并发写 ≈ 3 倍（写独占串行）。
[db]
latency_ms = 40

# 数据访问模块执行器线程数 = 同时能跑几个读（写始终独占，不会并发）
threads = 4

# 用户业务模块：周期演示间隔（毫秒）
[async]
interval_ms = 5000
